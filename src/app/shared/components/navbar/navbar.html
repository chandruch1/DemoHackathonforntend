<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
  <div class="container">

    <!-- Brand -->
    <a class="navbar-brand fw-bold text-danger" routerLink="/">
      <i class="bi bi-shop"></i>
      Retail<span class="text-dark">Store</span>
    </a>

    <!-- Mobile Toggle -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#customerNavbar"
      aria-controls="customerNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="customerNavbar">

      <!-- Navigation Links -->
      <ul class="navbar-nav mx-auto">

        <li class="nav-item">
          <a class="nav-link"
             routerLink="/"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }">
            Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             routerLink="/products"
             routerLinkActive="active">
            Products
          </a>
        </li>

        <ng-container *ngIf="isLoggedIn">

          <li class="nav-item" *ngIf="currentUser()?.role === 'Admin'">
            <a class="nav-link" routerLink="/admin/dashboard">
              Admin
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               routerLink="/my-orders"
               routerLinkActive="active">
              My Orders
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               routerLink="/profile"
               routerLinkActive="active">
              My Profile
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               routerLink="/addresses"
               routerLinkActive="active">
              My Addresses
            </a>
          </li>

        </ng-container>

      </ul>

      <!-- Right Side Actions -->
      <div class="d-flex align-items-center gap-3">

        <a routerLink="/cart" class="nav-icon">
          <i class="bi bi-cart3"></i>
          Cart
        </a>

        <ng-container *ngIf="!isLoggedIn; else loggedInMenu">

          <a routerLink="/login"
             class="btn btn-danger px-4">
            Login
          </a>

        </ng-container>

        <ng-template #loggedInMenu>

          <button
            class="btn btn-outline-danger px-4"
            type="button"
            (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i>
            Logout
          </button>

        </ng-template>

      </div>

    </div>
  </div>
</nav>
